name: Signed APK release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Sign and verify APK
        env:
          TRRRST_KEYSTORE_BASE64: ${{ secrets.TRRRST_KEYSTORE_BASE64 }}
          TRRRST_KEYSTORE_PASSWORD: ${{ secrets.TRRRST_KEYSTORE_PASSWORD }}
          TRRRST_KEY_ALIAS: ${{ secrets.TRRRST_KEY_ALIAS }}
          TRRRST_KEY_PASSWORD: ${{ secrets.TRRRST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TRRRST_KEYSTORE_BASE64" ]; then
            echo "Missing TRRRST_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$TRRRST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          APK_DIR=app/build/outputs/apk/release
          OUTPUT="$APK_DIR/trrrst-watch-${{ github.ref_name }}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            "$APK_DIR/app-release-unsigned.apk" "$APK_DIR/app-release-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$TRRRST_KEY_ALIAS" \
            --ks-pass "env:TRRRST_KEYSTORE_PASSWORD" \
            --key-pass "env:TRRRST_KEY_PASSWORD" \
            --out "$OUTPUT" "$APK_DIR/app-release-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/trrrst-watch-${{ github.ref_name }}.apk
